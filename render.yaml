services:
  - type: web
    name: neon-strike-fps
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: neon-strike-accounts
          property: connectionString

databases:
  - name: neon-strike-accounts
    databaseName: neon_strike
    user: neon_strike_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []
