services:
  - type: web
    name: neon-strike-fps
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Set this manually in Render Dashboard > Service > Environment.
      # Use the pooled PostgreSQL connection string from Neon. Never commit the secret URL.
      - key: DATABASE_URL
        sync: false

# Legacy Render Postgres resource retained in the Blueprint to avoid an accidental
# deletion during sync. Once Neon is verified and any old account data is migrated,
# you may remove this resource manually. The app uses the DATABASE_URL set above.
databases:
  - name: neon-strike-accounts
    databaseName: neon_strike
    user: neon_strike_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []
